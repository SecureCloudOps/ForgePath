apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform
  namespace: default
  description: ForgePath platform owners
spec:
  type: team
  profile:
    displayName: Platform
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: forgepath
  description: Secure paved paths and their delivery controls
spec:
  owner: group:default/platform
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: secure-fastapi-service-argocd
  description: Read-only Argo CD delivery status for the reference service
  annotations:
    backstage.io/kubernetes-label-selector: app.kubernetes.io/name=secure-fastapi-service
    backstage.io/kubernetes-namespace: argocd
spec:
  type: argocd-application
  owner: group:default/platform
  system: forgepath
  dependencyOf:
    - component:default/secure-fastapi-service
