{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "service.fullname" . }}-grafana-dashboard
  labels:
    {{- include "service.labels" . | nindent 4 }}
    {{ .Values.monitoring.grafana.dashboardLabel }}: {{ .Values.monitoring.grafana.dashboardLabelValue | quote }}
data:
  slo-dashboard.json: |-
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "reqps"}},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
          "id": 1,
          "targets": [{"expr": "sum(rate(http_requests_total{forgepath_service=\"{{ include "service.fullname" . }}\",path!~\"/metrics|/health/live|/health/ready\"}[$__rate_interval]))", "legendFormat": "eligible requests"}],
          "title": "Traffic",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0}},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
          "id": 2,
          "targets": [{"expr": "forgepath:sli_errors:rate5m{forgepath_service=\"{{ include "service.fullname" . }}\"} / clamp_min(forgepath:sli_requests:rate5m{forgepath_service=\"{{ include "service.fullname" . }}\"}, 1e-12)", "legendFormat": "5xx ratio"}],
          "title": "Errors",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "s", "min": 0}},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "id": 3,
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{forgepath_service=\"{{ include "service.fullname" . }}\",path!~\"/metrics|/health/live|/health/ready\"}[$__rate_interval])))", "legendFormat": "p95"}],
          "title": "Latency",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 8},
          "id": 4,
          "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"{{ .Release.Namespace }}\",pod=~\"{{ include "service.fullname" . }}-.*\",container=\"application\"}[$__rate_interval])) / clamp_min(sum(kube_pod_container_resource_limits{namespace=\"{{ .Release.Namespace }}\",pod=~\"{{ include "service.fullname" . }}-.*\",container=\"application\",resource=\"cpu\"}), 1e-12)", "legendFormat": "CPU limit utilization"}],
          "title": "CPU saturation",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 8},
          "id": 5,
          "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace=\"{{ .Release.Namespace }}\",pod=~\"{{ include "service.fullname" . }}-.*\",container=\"application\"}) / clamp_min(sum(kube_pod_container_resource_limits{namespace=\"{{ .Release.Namespace }}\",pod=~\"{{ include "service.fullname" . }}-.*\",container=\"application\",resource=\"memory\"}), 1)", "legendFormat": "memory limit utilization"}],
          "title": "Memory saturation",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 0.5}]}}},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 8},
          "id": 6,
          "targets": [{"expr": "forgepath:slo_error_budget_remaining:ratio{forgepath_service=\"{{ include "service.fullname" . }}\"}", "legendFormat": "remaining"}],
          "title": "Availability error budget remaining",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "id": 7,
          "targets": [{"expr": "forgepath:sli_availability:ratio_rate5m{forgepath_service=\"{{ include "service.fullname" . }}\"}", "legendFormat": "availability"}, {"expr": "forgepath:slo_availability:target{forgepath_service=\"{{ include "service.fullname" . }}\"}", "legendFormat": "99.9% target"}],
          "title": "Availability SLI",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "id": 8,
          "targets": [{"expr": "forgepath:sli_latency_under_300ms:ratio_rate5m{forgepath_service=\"{{ include "service.fullname" . }}\"}", "legendFormat": "under 300 ms"}],
          "title": "Latency SLI",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["forgepath", "slo"],
      "templating": {"list": [{"current": {}, "label": "Prometheus", "name": "datasource", "query": "prometheus", "type": "datasource"}]},
      "time": {"from": "now-6h", "to": "now"},
      "title": "{{ include "service.fullname" . }} service SLO",
      "uid": "{{ include "service.fullname" . }}-slo",
      "version": 1
    }
{{- end }}

