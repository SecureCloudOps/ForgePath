apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: forgepath-serviceaccount-security
  annotations:
    policies.kyverno.io/title: ForgePath ServiceAccount Security
    policies.kyverno.io/category: ForgePath Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: ServiceAccount
    kyverno.io/kyverno-version: 1.18.2
    kyverno.io/kubernetes-version: "1.32"
spec:
  admission: true
  background: true
  failurePolicy: Fail
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 10
  rules:
    - name: disable-service-account-token
      match:
        any:
          - resources:
              kinds:
                - ServiceAccount
      exclude:
        any:
          - resources:
              names:
                - default
          - resources:
              namespaces:
                - kube-system
                - kyverno
      validate:
        allowExistingViolations: false
        message: Managed ServiceAccounts must set automountServiceAccountToken=false.
        pattern:
          automountServiceAccountToken: false
