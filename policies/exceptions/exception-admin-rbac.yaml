apiVersion: v1
kind: Namespace
metadata:
  name: forgepath-policy-exceptions
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.32
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgepath-policy-exception-admin
  namespace: forgepath-policy-exceptions
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgepath-policy-exception-admin
  namespace: forgepath-policy-exceptions
rules:
  - apiGroups:
      - kyverno.io
    resources:
      - policyexceptions
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgepath-policy-exception-admin
  namespace: forgepath-policy-exceptions
subjects:
  - kind: ServiceAccount
    name: forgepath-policy-exception-admin
    namespace: forgepath-policy-exceptions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgepath-policy-exception-admin
