apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secure-fastapi-service-local
  namespace: argocd
  labels:
    app.kubernetes.io/name: secure-fastapi-service
    app.kubernetes.io/part-of: forgepath
spec:
  project: forgepath-local
  source:
    repoURL: git@github.com:SecureCloudOps/ForgePath.git
    targetRevision: main
    path: services/secure-fastapi-service/chart
    helm:
      releaseName: secure-fastapi-service
      valueFiles:
        - ../../../gitops/environments/local/secure-fastapi-service/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: secure-fastapi-service-local
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: v1.32
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/audit-version: v1.32
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: v1.32
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
