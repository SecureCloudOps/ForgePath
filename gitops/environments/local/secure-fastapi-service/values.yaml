replicaCount: 20

image:
  repository: ghcr.io/securecloudops/secure-fastapi-service
  digest: "sha256:d971dc0d119a17e9b361906b67eb0fbada2cac6d197ec338620ecfd7e1eeba2c"
  pullPolicy: IfNotPresent

workloadMetadata:
  owner: platform
  system: forgepath
  environment: local
  dataClassification: internal
  supportTier: "2"

service:
  port: 80

failureFixture:
  enabled: false

progressiveDelivery:
  analysis:
    prometheusAddress: http://prometheus-operated.monitoring.svc.cluster.local:9090
    burnRateWindow: 5m
    maxBurnRate: 14.4
    initialDelay: 6m
    timeoutSeconds: 10

monitoring:
  enabled: true
  serviceMonitor:
    interval: 30s
    scrapeTimeout: 5s
  prometheusAccess:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podSelector:
      matchLabels:
        app.kubernetes.io/name: prometheus
  slo:
    availabilityTarget: 0.999
    latencyThresholdSeconds: 0.3
    windowProfile: production
  grafana:
    dashboardLabel: grafana_dashboard
    dashboardLabelValue: "1"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

namespaceProtection:
  resourceQuota:
    requestsCpu: "4"
    requestsMemory: 4Gi
    limitsCpu: "12"
    limitsMemory: 6Gi
    pods: "30"
    services: "10"
    configMaps: "20"
  limitRange:
    defaultRequestCpu: 100m
    defaultRequestMemory: 128Mi
    defaultCpu: 500m
    defaultMemory: 256Mi
    minCpu: 10m
    minMemory: 32Mi
    maxCpu: "1"
    maxMemory: 512Mi
    maxCpuLimitRequestRatio: "5"
    maxMemoryLimitRequestRatio: "2"

networkPolicy:
  applicationIngress:
    enabled: false
    namespaceSelector:
      matchLabels:
        forgepath.dev/access: application
    podSelector:
      matchLabels:
        forgepath.dev/client: application
  dnsEgress:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
