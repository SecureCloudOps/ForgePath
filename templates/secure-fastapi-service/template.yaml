apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: secure-fastapi-service
  title: Secure FastAPI service
  description: Generate the existing ForgePath secure FastAPI paved path locally.
  tags:
    - python
    - fastapi
    - kubernetes
    - secure-by-default
spec:
  owner: group:default/platform
  type: service
  presentation:
    buttonLabels:
      createButtonText: Generate locally
  parameters:
    - title: Service metadata
      required:
        - name
        - description
        - owner
        - kubernetesNamespace
      properties:
        name:
          title: Service name
          type: string
          pattern: ^[a-z][a-z0-9-]{1,61}[a-z0-9]$
          description: A 3-63 character DNS label.
        description:
          title: Description
          type: string
          default: A secure FastAPI service generated by ForgePath.
        owner:
          title: Owner
          type: string
          default: group:default/platform
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
        kubernetesNamespace:
          title: Kubernetes namespace
          type: string
          pattern: ^[a-z][a-z0-9-]{1,61}[a-z0-9]$
          default: secure-fastapi-service-local
  steps:
    - id: generateLocal
      name: Generate from the ForgePath paved path
      action: forgepath:renderSecureFastapi
      input:
        name: ${{ parameters.name }}
        description: ${{ parameters.description }}
        owner: ${{ parameters.owner }}
        kubernetesNamespace: ${{ parameters.kubernetesNamespace }}
  output:
    text:
      - title: Local generation complete
        content: |
          Generated `${{ parameters.name }}` at `${{ steps.generateLocal.output.localPath }}`.
          Nothing was published or registered remotely.
