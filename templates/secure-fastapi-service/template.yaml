apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: secure-fastapi-service
  title: Create Secure FastAPI Service
  description: Validate, generate, and safely publish the complete ForgePath paved path.
  tags:
    - python
    - fastapi
    - kubernetes
    - secure-by-default
spec:
  owner: group:default/platform
  type: service
  presentation:
    buttonLabels:
      createButtonText: Create secure service
  parameters:
    - title: Service metadata
      required:
        - name
        - owner
        - system
        - environment
        - dataClassification
      properties:
        name:
          title: Service name
          type: string
          pattern: ^[a-z][a-z0-9-]{1,61}[a-z0-9]$
          description: A 3-63 character DNS label.
        owner:
          title: Owner
          type: string
          default: group:default/platform
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
        system:
          title: System
          type: string
          default: forgepath
          description: Must match a server-side allowlist of Backstage systems.
        environment:
          title: Environment
          type: string
          enum: [local, development, staging, production]
          default: development
        dataClassification:
          title: Data classification
          type: string
          enum: [public, internal, confidential, restricted]
          description: Required; controls handling and policy expectations.
    - title: Safe publishing
      required:
        - publishMode
        - repositoryOwner
      properties:
        publishMode:
          title: Publishing mode
          type: string
          enum: [local, github]
          enumNames: [Local Git simulation, GitHub App publication]
          default: local
        repositoryOwner:
          title: Repository organization
          type: string
          default: SecureCloudOps
          description: Must match a server-side allowlist; it cannot select an arbitrary target.
  steps:
    - id: createService
      name: Validate, generate, and safely publish
      action: forgepath:createSecureFastapi
      input:
        name: ${{ parameters.name }}
        owner: ${{ parameters.owner }}
        system: ${{ parameters.system }}
        environment: ${{ parameters.environment }}
        dataClassification: ${{ parameters.dataClassification }}
        publishMode: ${{ parameters.publishMode }}
        repositoryOwner: ${{ parameters.repositoryOwner }}
        privileged: false
  output:
    text:
      - title: Secure service request complete
        content: |
          Service repository: `${{ steps.createService.output.serviceRepository }}`

          Service onboarding PR: `${{ steps.createService.output.servicePullRequest }}`

          GitOps onboarding PR: `${{ steps.createService.output.gitopsPullRequest }}`
