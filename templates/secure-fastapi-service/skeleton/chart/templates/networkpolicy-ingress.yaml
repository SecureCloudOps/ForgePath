{{- if or .Values.networkPolicy.applicationIngress.enabled .Values.monitoring.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "service.fullname" . }}-allow-ingress
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "service.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.networkPolicy.applicationIngress.enabled }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.applicationIngress.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.applicationIngress.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if .Values.monitoring.enabled }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.monitoring.prometheusAccess.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.monitoring.prometheusAccess.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
{{- end }}
