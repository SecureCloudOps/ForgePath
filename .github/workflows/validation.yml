name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secure-fastapi-service:
    name: Secure FastAPI paved path
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned validation tools
        uses: jdx/mise-action@be3be2260bc02bc3fbf94c5e2fed8b7964baf074 # v3.4.0

      - name: Run static policy and security validation
        run: make validate-security-static

      - name: Cache the pinned Trivy 0.73.0 DB snapshot
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .forgepath/cache/trivy
          key: trivy-0.73.0-db-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            trivy-0.73.0-db-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Run explicitly online vulnerability validation
        run: make validate-trivy-online

      - name: Validate the local Backstage paved-path consumer
        run: make validate-backstage-static
