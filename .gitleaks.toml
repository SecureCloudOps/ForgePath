title = "ForgePath Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "forgepath-synthetic-secret"
description = "ForgePath synthetic secret used only by negative tests"
regex = '''FORGEPATH_SYNTHETIC_SECRET_[A-Z0-9]{20}'''
keywords = ["FORGEPATH_SYNTHETIC_SECRET_"]

[allowlist]
description = "Synthetic fixtures and ignored local artifact outputs"
paths = [
  '''tests/security/fixtures/fake-secret\.txt''',
  '''^\.forgepath/''',
  # Backstage builds ignored third-party bundles and source maps here. Git
  # history is still scanned separately, while source remains in scope.
  '''^platform/backstage/packages/[^/]+/dist/''',
]
